# ===== PROD: untuk server production =====

# Jangan tampilkan SQL
spring.jpa.show-sql=false

# Log seperlunya
logging.level.root=WARN
logging.level.com.refresh.customer_api=INFO

# Matikan Swagger supaya struktur API tidak terbuka ke publik
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false