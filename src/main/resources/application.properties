spring.application.name=backend

# Profile default kalau tidak ditentukan dari luar
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AdventureWorks2022;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.data.web.pageable.serialization-mode=via_dto
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method