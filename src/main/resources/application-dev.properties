# ===== DEV: untuk development di laptop =====

# Tampilkan SQL yang dijalankan Hibernate, dalam format rapi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log detail untuk kode kita sendiri
logging.level.com.refresh.customer_api=DEBUG

# Tampilkan nilai parameter query (isi tanda ? di SQL)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger aktif
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true